rules:
  - effective_from: 2019-11-22
    effective_to: null
    fiscal_stream: royalty
    rule_type: piecewise_schedule
    tax_base: sales assessment of minerals sold, shipped for sale, exported, or used
    rate: {base_percent: 5}
    thresholds: coal product and benchmark-price schedule in Minerals Law Article 47.17
    reference_price_rule: Government commodity-exchange-price list under Article 47.14; product classification and applicable price observations required
    deductible_cost_rule: not applicable
    ownership_share: null
    payout_rule: null
