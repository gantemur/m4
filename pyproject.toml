[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m4-mongolia-mining-macro"
version = "0.0.1"
description = "Reproducible foundation for the Mongolia Mining-Macro Model"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/m4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
